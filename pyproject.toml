[project]
name = "httpcache-lint"
version = "0.1.0"
description = "A linter for HTTP Cache-Control headers with precise line/column error locations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "patriciad37" }]

[project.scripts]
httpcache-lint = "httpcache_lint.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["httpcache_lint*"]
